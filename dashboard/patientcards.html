<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Hospital Dashboard - Patient Cards</title>
    <link rel="stylesheet" href="patientcards.css">
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
</head>
<body>
    <header class="header">
        <div class="header-container">
            <h1>Hospital Dashboard - Patient Cards</h1>
        </div>
    </header>

    <main class="main-content">
        <div class="controls">
            <div class="search-container">
                <input type="text" id="searchInput" placeholder="Search by Name or ID...">
            </div>
            <div class="filter-container">
                <select id="priorityFilter">
                    <option value="All">All Priorities</option>
                    <option value="Critical">Critical</option>
                    <option value="High">High</option>
                    <option value="Medium">Medium</option>
                    <option value="Low">Low</option>
                </select>
            </div>
        </div>

        <div id="patientGrid" class="patient-grid">
            <!-- Patient cards will be injected here by JS -->
        </div>
    </main>

    <script src="patientcards.js"></script>
</body>
</html>
