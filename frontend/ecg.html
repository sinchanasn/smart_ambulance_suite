<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Ambulance - ECG Image Capture</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card ecg-card">
            <div class="icon-container">
                <i class="fa-solid fa-heart-pulse"></i>
            </div>
            <h1>ECG Image Capture</h1>
            <p class="subtitle">Capture or upload a clear image of the patient's ECG report for AI-based analysis.</p>

            <div class="error-message" id="ecgErrorMessage"></div>
            <div class="success-message" id="ecgSuccessMessage" style="display: none;"></div>

            <!-- Initial Action Buttons -->
            <div class="ecg-actions" id="ecgInitialActions">
                <!-- Using a hidden file input for camera capture and upload -->
                <!-- The capture="environment" attribute specifically opens the back camera on mobile devices -->
                <input type="file" id="cameraInput" accept=".jpg, .jpeg, .png, image/jpeg, image/png, image/jpg"
                    capture="environment" style="display: none;">
                <button type="button" class="primary-button action-btn"
                    onclick="document.getElementById('cameraInput').click()">
                    <i class="fa-solid fa-camera"></i> Capture Image
                </button>

                <input type="file" id="uploadInput" accept=".jpg, .jpeg, .png, image/jpeg, image/png, image/jpg"
                    style="display: none;">
                <button type="button" class="secondary-button action-btn"
                    onclick="document.getElementById('uploadInput').click()">
                    <i class="fa-solid fa-upload"></i> Upload ECG Image
                </button>
            </div>

            <!-- Preview Area (Hidden initially) -->
            <div class="ecg-preview-container" id="ecgPreviewContainer" style="display: none;">
                <img id="ecgPreviewImage" src="" alt="ECG Preview">

                <div class="form-actions-row">
                    <button type="button" id="retakeBtn" class="secondary-button"
                        onclick="document.getElementById('cameraInput').click()">Retake Image</button>
                    <button type="button" id="uploadAnotherBtn" class="secondary-button"
                        onclick="document.getElementById('uploadInput').click()">Upload Another</button>
                </div>
                <button type="button" id="submitEcgBtn" class="login-button" style="width: 100%;">Submit ECG</button>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
