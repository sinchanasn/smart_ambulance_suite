<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Ambulance - Patient Registration</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <div class="login-container registration-container">
        <div class="login-card registration-card">
            <div class="icon-container">
                <i class="fa-solid fa-file-medical"></i>
            </div>
            <h1>Patient Registration</h1>
            <p class="subtitle">Enter patient details for emergency record</p>

            <form id="patientForm" class="login-form">
                <div class="error-message" id="errorMessage"></div>
                
                <div class="form-grid">
                    <!-- Name -->
                    <div class="input-group">
                        <i class="fa-solid fa-user input-icon"></i>
                        <input type="text" id="patientName" placeholder="Patient Full Name *">
                    </div>
                    
                    <!-- Age -->
                    <div class="input-group">
                        <i class="fa-solid fa-calendar-days input-icon"></i>
                        <input type="number" id="patientAge" placeholder="Age *" min="0">
                    </div>

                    <!-- Gender -->
                    <div class="input-group select-group">
                        <i class="fa-solid fa-venus-mars input-icon"></i>
                        <select id="patientGender">
                            <option value="" disabled selected>Select Gender *</option>
                            <option value="Male">Male</option>
                            <option value="Female">Female</option>
                            <option value="Other">Other</option>
                        </select>
                    </div>

                    <!-- Blood Group -->
                    <div class="input-group select-group">
                        <i class="fa-solid fa-droplet input-icon" style="color: var(--accent-red);"></i>
                        <select id="bloodGroup">
                            <option value="" disabled selected>Blood Group (Optional)</option>
                            <option value="A+">A+</option>
                            <option value="A-">A-</option>
                            <option value="B+">B+</option>
                            <option value="B-">B-</option>
                            <option value="O+">O+</option>
                            <option value="O-">O-</option>
                            <option value="AB+">AB+</option>
                            <option value="AB-">AB-</option>
                        </select>
                    </div>

                    <!-- Phone Number -->
                    <div class="input-group">
                        <i class="fa-solid fa-phone input-icon"></i>
                        <input type="tel" id="patientPhone" placeholder="Phone Number (Optional)">
                    </div>

                    <!-- Emergency Contact -->
                    <div class="input-group">
                        <i class="fa-solid fa-phone-volume input-icon" style="color: var(--accent-red);"></i>
                        <input type="tel" id="emergencyContact" placeholder="Emergency Contact *">
                    </div>

                    <!-- Height -->
                    <div class="input-group">
                        <i class="fa-solid fa-ruler-vertical input-icon"></i>
                        <input type="number" id="patientHeight" placeholder="Height (cm)" min="0">
                    </div>

                    <!-- Weight -->
                    <div class="input-group">
                        <i class="fa-solid fa-weight-scale input-icon"></i>
                        <input type="number" id="patientWeight" placeholder="Weight (kg)" min="0">
                    </div>

                    <!-- Heart Rate -->
                    <div class="input-group">
                        <i class="fa-solid fa-heart-pulse input-icon" style="color: var(--accent-red);"></i>
                        <input type="number" id="heartRate" placeholder="Heart Rate (BPM) *" min="0">
                    </div>

                    <!-- Blood Pressure -->
                    <div class="input-group">
                        <i class="fa-solid fa-stethoscope input-icon"></i>
                        <input type="text" id="bloodPressure" placeholder="Blood Pressure (Sys/Dia) *">
                    </div>

                    <!-- Oxygen Saturation -->
                    <div class="input-group">
                        <i class="fa-solid fa-lungs input-icon"></i>
                        <input type="number" id="oxygenSaturation" placeholder="Oxygen Saturation (SpO₂ %) *" min="0" max="100">
                    </div>

                    <!-- Body Temperature -->
                    <div class="input-group">
                        <i class="fa-solid fa-temperature-half input-icon"></i>
                        <input type="number" id="bodyTemperature" placeholder="Body Temperature (°C)" step="0.1">
                    </div>
                </div>

                <!-- Allergies -->
                <div class="input-group">
                    <i class="fa-solid fa-virus-slash input-icon"></i>
                    <input type="text" id="allergies" placeholder="Allergies (Optional)">
                </div>

                <!-- Symptoms -->
                <div class="input-group textarea-group">
                    <i class="fa-solid fa-notes-medical input-icon"></i>
                    <textarea id="symptoms" placeholder="Current Symptoms *"></textarea>
                </div>

                <div class="form-actions-row">
                    <button type="button" id="clearBtn" class="secondary-button">Clear Form</button>
                    <button type="button" id="saveBtn" class="primary-button">Save Patient Details</button>
                    <button type="submit" id="nextBtn" class="login-button" style="margin-top: 0;">Next</button>
                </div>
            </form>
        </div>
    </div>
    
    <script src="script.js"></script>
</body>
</html>
