<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Smart Ambulance - Sign Up</title>
    <!-- Google Fonts -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>

<body>
    <div class="login-container">
        <div class="login-card">
            <div class="icon-container">
                <i class="fa-solid fa-user-plus"></i>
            </div>
            <h1>Create Account</h1>
            <p class="subtitle">Join the Smart Ambulance Network</p>

            <form id="signupForm" class="login-form">
                <div class="error-message" id="errorMessage"></div>

                <div class="input-group">
                    <i class="fa-solid fa-user input-icon"></i>
                    <input type="text" id="fullname" placeholder="Full Name" autocomplete="name">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-envelope input-icon"></i>
                    <input type="email" id="email" placeholder="Email Address" autocomplete="email">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-phone input-icon"></i>
                    <input type="tel" id="phone" placeholder="Phone Number" autocomplete="tel">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="password" placeholder="Password" autocomplete="new-password">
                </div>

                <div class="input-group">
                    <i class="fa-solid fa-lock input-icon"></i>
                    <input type="password" id="confirmPassword" placeholder="Confirm Password"
                        autocomplete="new-password">
                </div>

                <button type="submit" class="login-button">Create Account</button>

                <div class="auth-link-container">
                    <a href="login.html" class="forgot-password">Already have an account? Login</a>
                </div>
            </form>
        </div>
    </div>

    <script src="script.js"></script>
</body>

</html>
